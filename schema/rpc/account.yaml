domain: account
doc: Mail accounts and their server settings. Credentials are write-only over RPC; account.setPassword stores one and no method returns it.
enums:
  - name: AccountKind
    doc: The provider family, which selects the sync strategy and server quirks.
    values:
      - {name: imap, doc: "Generic IMAP and SMTP."}
      - {name: gmail, doc: "Google Gmail and Workspace (labels, X-GM extensions)."}
      - {name: microsoft, doc: "Microsoft 365 and Outlook.com."}
      - {name: icloud, doc: "Apple iCloud Mail."}
  - name: AuthKind
    doc: How the account authenticates to its servers.
    values:
      - {name: password, doc: "A password or app-specific password, kept in the secret store."}
      - {name: oauth2, doc: "OAuth 2.0 tokens (SASL XOAUTH2), kept in the secret store."}
  - name: DiscoverySource
    doc: Where account.discover found server settings.
    values:
      - {name: profile, doc: "Frostmail's own profile for the provider (Gmail, iCloud)."}
      - {name: autoconfig, doc: "The domain's Mozilla autoconfig file."}
      - {name: ispdb, doc: "Thunderbird's ISP database."}
      - {name: srv, doc: "The domain's RFC 6186 SRV records."}
      - {name: none, doc: "Nothing found; the user enters the servers."}
  - name: TLSMode
    doc: How a connection is secured.
    values:
      - {name: tls, doc: "TLS from the first byte (IMAPS 993, SMTPS 465)."}
      - {name: starttls, doc: "Plain connection upgraded with STARTTLS (143, 587)."}
      - {name: insecure, doc: "No TLS. Only for local test servers."}
  - name: ServiceKind
    doc: A service an account syncs besides mail (ADR-0017).
    values:
      - {name: contacts, doc: "Address books over CardDAV."}
      - {name: calendar, doc: "Calendars over CalDAV."}
      - {name: tasks, doc: "Google Tasks for Google accounts; task lists over CalDAV for others."}
  - name: CollectionKind
    doc: What a collection holds.
    values:
      - {name: addressbook, doc: "A CardDAV address book."}
      - {name: calendar, doc: "A CalDAV calendar, holding events, tasks or both."}
      - {name: tasklist, doc: "A Google Tasks list."}
types:
  - name: ServerConfig
    doc: Where and how to reach one server.
    fields:
      - {name: host, type: string}
      - {name: port, type: int}
      - {name: tls, type: TLSMode}
      - {name: username, type: string, doc: "Login name; often the email address."}
  - name: Account
    doc: A configured mail account.
    fields:
      - {name: id, type: int, doc: "Stable local identifier."}
      - {name: kind, type: AccountKind}
      - {name: email, type: string, doc: "The account's primary address."}
      - {name: displayName, type: string, doc: "The sender name used in From headers."}
      - {name: auth, type: AuthKind}
      - {name: imap, type: ServerConfig}
      - {name: smtp, type: ServerConfig}
      - {name: createdAt, type: time}
      - {name: readOnly, type: bool, doc: "maild makes no changes on the server: no flags, moves, deletes, sends or draft copies."}
      - {name: notify, type: bool, doc: "New mail in the inbox shows a desktop notification."}
      - {name: syncDays, type: int, doc: "maild keeps the messages that arrived in the last syncDays days; 0 keeps every message (ADR-0016)."}
      - {name: signedIn, type: bool, doc: "A password or OAuth token is stored and the server has not refused it."}
  - name: Discovery
    doc: Server settings found for an address.
    fields:
      - {name: kind, type: AccountKind}
      - {name: source, type: DiscoverySource}
      - {name: auth, type: "[]AuthKind", doc: "The sign-in kinds the provider accepts, preferred first."}
      - {name: imap, type: ServerConfig, optional: true}
      - {name: smtp, type: ServerConfig, optional: true}
  - name: AuthorizeResult
    doc: An OAuth sign-in in progress.
    fields:
      - {name: url, type: string, doc: "Open in the system browser; maild finishes the sign-in when the browser returns."}
  - name: MailboxCheck
    doc: How one synced folder compares with the server.
    fields:
      - {name: mailboxId, type: int}
      - {name: path, type: string}
      - {name: server, type: int, doc: "Messages on the server."}
      - {name: local, type: int, doc: "Messages stored locally."}
      - {name: missingLocally, type: "[]int", doc: "Server UIDs with no local message (at most 20). UIDs from the folder's last UIDNEXT on are new mail, not missing."}
      - {name: missingOnServer, type: "[]int", doc: "Local UIDs the server no longer has (at most 20)."}
      - {name: flagDiffs, type: int, doc: "Messages whose flags differ, leaving out those changed since the last pass or waiting for a queued action."}
      - {name: labelDiffs, type: int, doc: "Gmail: messages whose labels differ, with the same exceptions."}
  - name: ServiceSettings
    doc: One of an account's services besides mail.
    fields:
      - {name: service, type: ServiceKind}
      - {name: available, type: bool, doc: "The provider offers the service; iCloud's tasks, for one, are out of reach."}
      - {name: enabled, type: bool}
      - {name: url, type: string, doc: "Where the service lives: the DAV home set, or the Tasks API. Empty until found."}
      - {name: signedIn, type: bool, doc: "The account's sign-in covers the service. False for a Google account whose grant lacks the service's scope: account.authorize asks for it."}
      - {name: lastSyncAt, type: time, optional: true, doc: "The end of the last complete pass."}
      - {name: error, type: string, optional: true, doc: "Why the last pass failed."}
  - name: Collection
    doc: An address book, calendar or task list.
    fields:
      - {name: id, type: int}
      - {name: accountId, type: int}
      - {name: kind, type: CollectionKind}
      - {name: name, type: string}
      - {name: color, type: string, doc: "#rrggbb, or empty for the module's default."}
      - {name: events, type: bool, doc: "Holds events."}
      - {name: tasks, type: bool, doc: "Holds tasks: a task list, or a calendar with VTODO."}
      - {name: readOnly, type: bool, doc: "The server refuses changes, or the account is read-only."}
      - {name: enabled, type: bool, doc: "Synced and shown."}
      - {name: isDefault, type: bool, doc: "Where the account's new contacts, events or tasks go."}
  - name: CollectionCheck
    doc: How one synced address book, calendar or task list compares with the server.
    fields:
      - {name: collectionId, type: int}
      - {name: name, type: string}
      - {name: server, type: int, doc: "Objects on the server."}
      - {name: local, type: int, doc: "Objects stored locally."}
      - {name: missingLocally, type: "[]string", doc: "Server hrefs with no local object (at most 20)."}
      - {name: missingOnServer, type: "[]string", doc: "Local hrefs the server does not have (at most 20), leaving out changes waiting to be written."}
      - {name: etagDiffs, type: int, doc: "Objects whose ETag differs, with the same exception."}
  - name: VerifyReport
    doc: The result of account.verify.
    fields:
      - {name: accountId, type: int}
      - {name: ok, type: bool, doc: "No folder or collection differs."}
      - {name: mailboxes, type: "[]MailboxCheck"}
      - {name: collections, type: "[]CollectionCheck", doc: "The enabled collections of the services that are on."}
      - {name: checkedAt, type: time}
methods:
  - name: list
    doc: All accounts, oldest first.
    result: "[]Account"
  - name: get
    doc: One account.
    params:
      - {name: id, type: int}
    result: Account
    errors: [notFound]
  - name: create
    doc: >-
      Add an account. The email address must be unique. Gmail and iCloud
      accounts may leave the servers out; their profiles fill them in.
    params:
      - {name: kind, type: AccountKind}
      - {name: email, type: string}
      - {name: displayName, type: string}
      - {name: auth, type: AuthKind}
      - {name: imap, type: ServerConfig, optional: true}
      - {name: smtp, type: ServerConfig, optional: true}
      - {name: readOnly, type: bool, optional: true, doc: "Default false."}
      - {name: notify, type: bool, optional: true, doc: "Default true."}
      - {name: syncDays, type: int, optional: true, doc: "Default 0: every message. At most 36500."}
    result: Account
    errors: [invalidParams, conflict]
  - name: update
    doc: Change an account's settings. Omitted fields keep their values.
    params:
      - {name: id, type: int}
      - {name: displayName, type: string, optional: true}
      - {name: imap, type: ServerConfig, optional: true}
      - {name: smtp, type: ServerConfig, optional: true}
      - {name: readOnly, type: bool, optional: true}
      - {name: notify, type: bool, optional: true}
      - {name: syncDays, type: int, optional: true, doc: "A new window: the next pass fetches what it adds and drops what it leaves."}
    result: Account
    errors: [invalidParams, notFound]
  - name: delete
    doc: Remove an account and everything stored for it.
    params:
      - {name: id, type: int}
    errors: [notFound]
  - name: setPassword
    doc: Store the password (or app-specific password) the account logs in with, and reconnect.
    params:
      - {name: id, type: int}
      - {name: password, type: string}
    errors: [notFound, invalidParams]
  - name: discover
    doc: Find server settings for an address (provider profiles, autoconfig, the ISPDB, SRV records).
    params:
      - {name: email, type: string}
    result: Discovery
    errors: [invalidParams]
  - name: authorize
    doc: >-
      Start an OAuth sign-in for an oauth2 account. maild listens on a
      loopback port for the browser's return for 5 minutes, then stores the
      token, reconnects, and emits account.changed.
    params:
      - {name: id, type: int}
    result: AuthorizeResult
    errors: [notFound, invalidParams, unavailable]
  - name: verify
    doc: Compare the stored mail with the server, changing nothing on either side.
    params:
      - {name: id, type: int}
    result: VerifyReport
    errors: [notFound, unavailable]
  - name: services
    doc: An account's contacts, calendar and tasks services, in that order.
    params:
      - {name: id, type: int}
    result: "[]ServiceSettings"
    errors: [notFound]
  - name: setService
    doc: >-
      Turn a service on or off. Turning one on without a url takes the
      provider's profile or discovers the server (well-known URLs, then SRV
      records) and syncs it; a Google account whose grant lacks the
      service's scope waits for account.authorize. Turning one off stops
      syncing and keeps what is stored.
    params:
      - {name: id, type: int}
      - {name: service, type: ServiceKind}
      - {name: enabled, type: bool}
      - {name: url, type: string, optional: true, doc: "The server's address, when discovery finds nothing."}
    result: ServiceSettings
    errors: [notFound, invalidParams, unavailable]
  - name: collections
    doc: Address books, calendars and task lists, by account, then by the server's order.
    params:
      - {name: accountId, type: int, optional: true}
      - {name: kind, type: CollectionKind, optional: true}
    result: "[]Collection"
  - name: setCollection
    doc: >-
      Show or hide a collection, or make it the default of its kind for its
      account. account.changed follows; showing or hiding also sends the
      collection's domain event (people.changed, calendar.changed or
      tasks.changed).
    params:
      - {name: id, type: int}
      - {name: enabled, type: bool, optional: true}
      - {name: isDefault, type: bool, optional: true, doc: "Only true: the previous default stops being one."}
    result: Collection
    errors: [notFound, invalidParams]
events:
  - name: changed
    doc: An account was created, updated or deleted, or its services or collections changed.
    durable: true
    fields:
      - {name: id, type: int}
      - {name: deleted, type: bool}
