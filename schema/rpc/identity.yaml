domain: identity
doc: The addresses an account sends as, with their signatures.
types:
  - name: Identity
    doc: One From address of an account.
    fields:
      - {name: id, type: int}
      - {name: accountId, type: int}
      - {name: name, type: string}
      - {name: email, type: string}
      - {name: replyTo, type: string}
      - {name: signatureHtml, type: string}
      - {name: isDefault, type: bool}
methods:
  - name: list
    doc: Identities, default first per account.
    params:
      - {name: accountId, type: int, optional: true}
    result: "[]Identity"
  - name: update
    doc: Change an identity's name, Reply-To or signature.
    params:
      - {name: id, type: int}
      - {name: name, type: string, optional: true}
      - {name: replyTo, type: string, optional: true}
      - {name: signatureHtml, type: string, optional: true}
    result: Identity
    errors: [notFound, invalidParams]
  - name: create
    doc: >-
      Add an address the account also sends and receives as, such as an
      alias or a custom domain the provider delivers to it. Invitations to
      it can be answered from the account. account.changed follows.
    params:
      - {name: accountId, type: int}
      - {name: email, type: string}
      - {name: name, type: string, optional: true, doc: "Default: the name of the account's default identity."}
    result: Identity
    errors: [notFound, invalidParams, conflict]
  - name: delete
    doc: >-
      Remove an address added with identity.create; drafts that used it
      move to the account's default identity. account.changed follows.
    params:
      - {name: id, type: int}
    errors: [notFound, conflict]
