domain: draft
doc: >-
  Drafts: messages being written. maild stores a draft at once on every
  update and keeps a copy in the account's Drafts mailbox; draft.send hands it
  to the outbox (docs/design/send.md).
enums:
  - name: DraftKind
    doc: How a new draft starts.
    values:
      - {name: new, doc: "An empty message with the identity's signature."}
      - {name: reply, doc: "A reply to the source's sender."}
      - {name: replyall, doc: "A reply to the sender and every other recipient but the account's own addresses."}
      - {name: forward, doc: "The source as quoted text with its attachments."}
      - {name: attached, doc: "Forward as Attachment: the source attached whole, as an .eml file. The draft is then a forward."}
types:
  - name: DraftAttachment
    doc: A file attached to a draft, stored by maild.
    fields:
      - {name: id, type: int}
      - {name: filename, type: string}
      - {name: contentType, type: string, doc: "Lowercase type/subtype."}
      - {name: size, type: int, doc: "Bytes."}
  - name: DraftUpload
    doc: An attachment arriving in chunks (draft.attachData).
    fields:
      - {name: uploadId, type: string, doc: "Names the upload in its later chunks."}
      - {name: received, type: int, doc: "The bytes maild holds: the next chunk's offset."}
      - {name: attachment, type: DraftAttachment, optional: true, doc: "The attachment, once the last chunk is in."}
  - name: DraftContent
    doc: What a compose window edits.
    fields:
      - {name: identityId, type: int}
      - {name: to, type: "[]Address"}
      - {name: cc, type: "[]Address"}
      - {name: bcc, type: "[]Address"}
      - {name: subject, type: string}
      - {name: html, type: string, doc: "The body as the editor's HTML."}
  - name: Draft
    doc: A message being written.
    fields:
      - {name: id, type: int}
      - {name: accountId, type: int}
      - {name: content, type: DraftContent}
      - {name: attachments, type: "[]DraftAttachment"}
      - {name: sourceId, type: int, optional: true, doc: "The message this draft replies to or forwards."}
      - {name: kind, type: DraftKind}
      - {name: updatedAt, type: time}
methods:
  - name: create
    doc: >-
      Start a draft: a new message in the account (or the first account), or a
      reply, reply-all or forward of a message.
    params:
      - {name: kind, type: DraftKind}
      - {name: accountId, type: int, optional: true}
      - {name: sourceId, type: int, optional: true, doc: "Required for reply, replyall and forward."}
      - {name: to, type: "[]Address", optional: true, doc: "A new message's recipients, such as the person a contact card writes to."}
    result: Draft
    errors: [notFound, invalidParams]
    callers: [local, session, agent]
    scope: write
  - name: open
    doc: Turn a message in a Drafts mailbox into a draft, or return the draft it already is.
    params:
      - {name: messageId, type: int}
    result: Draft
    errors: [notFound, unavailable]
  - name: get
    doc: One draft.
    params:
      - {name: id, type: int}
    result: Draft
    errors: [notFound]
    callers: [local, session, agent]
    scope: write
  - name: list
    doc: Drafts, most recently changed first.
    params:
      - {name: accountId, type: int, optional: true}
    result: "[]Draft"
    callers: [local, session, agent]
    scope: write
  - name: update
    doc: Replace a draft's content; maild stores it at once and updates the server copy later.
    params:
      - {name: id, type: int}
      - {name: content, type: DraftContent}
    result: Draft
    errors: [notFound, invalidParams]
    callers: [local, session, agent]
    scope: write
  - name: attach
    doc: Attach a local file; maild copies it, so later changes to the file do not matter.
    params:
      - {name: id, type: int}
      - {name: path, type: string, doc: "An absolute path on this machine."}
    result: DraftAttachment
    errors: [notFound, invalidParams]
    callers: [local]
  - name: attachData
    doc: >-
      Attach a file by its bytes, for a client that cannot name a path on
      maild's machine, such as a browser through lodge: in chunks, in
      order. The first chunk (offset 0, without uploadId) starts an upload
      of size bytes named filename; each later one names the upload and
      the offset it continues at. The chunk that completes size attaches
      the file as draft.attach does, and the result carries it. maild
      checks the name and the size, names the type from the name and the
      bytes, and discards an upload its connection leaves unfinished, or
      that sends nothing for 10 minutes.
    params:
      - {name: id, type: int}
      - {name: filename, type: string, doc: "The file's name, without a directory."}
      - {name: size, type: int, doc: "The whole file's bytes; the draft's attachments may total 25 MB."}
      - {name: offset, type: int, doc: "Where this chunk starts: 0, then the last result's received."}
      - {name: data, type: string, doc: "The chunk's bytes, base64 (standard alphabet, padded), 1 byte to 4 MiB decoded."}
      - {name: uploadId, type: string, optional: true, doc: "The upload, for every chunk after the first."}
    result: DraftUpload
    errors: [notFound, invalidParams, conflict]
  - name: detach
    doc: Remove an attachment from a draft.
    params:
      - {name: id, type: int}
      - {name: attachmentId, type: int}
    errors: [notFound]
  - name: delete
    doc: Discard a draft, and its server copy.
    params:
      - {name: id, type: int}
    errors: [notFound]
    callers: [local, session, agent]
    scope: write
  - name: send
    doc: >-
      Queue a draft for sending after the undo delay, or at sendAt (Send
      Later). Fails with invalidParams when it has no recipients, an address
      does not parse, or it is too large.
    params:
      - {name: id, type: int}
      - {name: sendAt, type: time, optional: true, doc: "Send Later: a time past the undo delay queues the message scheduled, with this time as its Date; an earlier one sends it after the undo delay."}
    result: OutboxItem
    errors: [notFound, invalidParams]
    callers: [local, session, agent]
    scope: send
events:
  - name: changed
    doc: A draft was created, changed or deleted.
    durable: true
    fields:
      - {name: id, type: int}
      - {name: accountId, type: int}
      - {name: deleted, type: bool}
