domain: people
doc: >-
  Contacts from the accounts' address books, joined into people by email
  address across address books and accounts (docs/design/pim.md), and
  their edits (ADR-0030, ADR-0032).
types:
  - name: PersonSummary
    doc: A row of the People list.
    fields:
      - {name: id, type: int}
      - {name: displayName, type: string}
      - {name: organization, type: string}
      - {name: email, type: string, doc: "The first email address of the person's first contact, or empty."}
      - {name: hasPhoto, type: bool}
      - {name: index, type: string, doc: "The letter the person files under in the list: the sort key's first letter, uppercased, or # when it is not a letter."}
  - name: LabeledValue
    doc: An email address, phone number or URL with its label.
    fields:
      - {name: label, type: string, doc: "home, work, mobile, other, or the card's own label; may be empty."}
      - {name: value, type: string}
  - name: PostalAddress
    doc: A postal address from a vCard's ADR.
    fields:
      - {name: label, type: string, doc: "home, work, other, or the card's own label; may be empty."}
      - {name: street, type: string, doc: "The street lines, joined by newlines."}
      - {name: locality, type: string}
      - {name: region, type: string}
      - {name: postcode, type: string}
      - {name: country, type: string}
  - name: Contact
    doc: One vCard of a person, from one address book, read from its source.
    fields:
      - {name: id, type: int}
      - {name: collectionId, type: int}
      - {name: accountId, type: int}
      - {name: displayName, type: string}
      - {name: givenName, type: string}
      - {name: familyName, type: string}
      - {name: nickname, type: string}
      - {name: organization, type: string}
      - {name: title, type: string}
      - {name: emails, type: "[]LabeledValue", doc: "Each address once, compared trimmed and without case, though the vCard may give it twice."}
      - {name: phones, type: "[]LabeledValue"}
      - {name: addresses, type: "[]PostalAddress"}
      - {name: urls, type: "[]LabeledValue"}
      - {name: birthday, type: string, doc: "YYYY-MM-DD, or --MM-DD without a year; empty when unknown."}
      - {name: note, type: string}
      - {name: readOnly, type: bool}
  - name: ContactFields
    doc: What an edit sets; absent fields keep their values, and a list replaces the whole list.
    fields:
      - {name: givenName, type: string, optional: true}
      - {name: familyName, type: string, optional: true}
      - {name: nickname, type: string, optional: true}
      - {name: organization, type: string, optional: true}
      - {name: title, type: string, optional: true}
      - {name: emails, type: "[]LabeledValue", optional: true}
      - {name: phones, type: "[]LabeledValue", optional: true}
      - {name: addresses, type: "[]PostalAddress", optional: true}
      - {name: urls, type: "[]LabeledValue", optional: true}
      - {name: birthday, type: string, optional: true, doc: "YYYY-MM-DD, --MM-DD, or empty to clear."}
      - {name: note, type: string, optional: true}
  - name: ContactWrite
    doc: What a change wrote, and how to undo it (ADR-0032).
    fields:
      - {name: contactId, type: int}
      - {name: person, type: Person, optional: true, doc: "The contact's person as changed; absent when no contact of theirs is left."}
      - {name: restoreId, type: string, doc: "For people.restore, within a day."}
  - name: Person
    doc: A person and every contact that makes them up.
    fields:
      - {name: id, type: int}
      - {name: displayName, type: string}
      - {name: organization, type: string}
      - {name: hasPhoto, type: bool}
      - {name: contacts, type: "[]Contact", doc: "In address book order: by account, then collection position."}
  - name: Photo
    doc: A person's photo.
    fields:
      - {name: contentType, type: string, doc: "Such as image/jpeg."}
      - {name: data, type: string, doc: "The image, base64-encoded."}
  - name: SenderPhoto
    doc: An address whose person has a photo (people.photo).
    fields:
      - {name: address, type: string, doc: "Lowercased."}
      - {name: personId, type: int}
  - name: ContactCard
    doc: What the app shows for an email address in mail.
    fields:
      - {name: email, type: string, doc: "Lowercased."}
      - {name: name, type: string, doc: "The person's name, else the name last seen with the address in mail; may be empty."}
      - {name: person, type: Person, optional: true, doc: "Absent when no contact has the address."}
      - {name: recent, type: "[]MessageSummary", doc: "The newest messages from or to the address, at most 5."}
      - {name: upcoming, type: "[]Occurrence", doc: "The next occurrences with the address as organizer or attendee, within 30 days, at most 5."}
      - {name: canAdd, type: bool, doc: "No contact has the address and an address book can take one: Add to Contacts is offered."}
methods:
  - name: list
    doc: >-
      People sorted by name. With query, those whose name, organization or
      email address has a word starting with it, case-insensitively.
    params:
      - {name: query, type: string, optional: true}
      - {name: collectionId, type: int, optional: true, doc: "Only people with a contact in this address book."}
    result: "[]PersonSummary"
  - name: get
    doc: One person with their contacts.
    params:
      - {name: id, type: int}
    result: Person
    errors: [notFound]
  - name: card
    doc: The contact card for an email address, person or not.
    params:
      - {name: email, type: string}
    result: ContactCard
    errors: [invalidParams]
  - name: photo
    doc: A person's photo, from the first of their contacts that has one.
    params:
      - {name: id, type: int}
    result: Photo
    errors: [notFound]
  - name: senders
    doc: >-
      Which of these addresses belong to a person with a photo, for contact
      photos in the message list. Addresses without one are left out.
    params:
      - {name: addresses, type: "[]string", doc: "At most 500."}
    result: "[]SenderPhoto"
    errors: [invalidParams]
  - name: add
    doc: >-
      Add to Contacts: store a new vCard 3.0 with the name and address in an
      address book and write it to the server.
    params:
      - {name: email, type: string}
      - {name: name, type: string, optional: true, doc: "Default: the name last seen with the address in mail."}
      - {name: collectionId, type: int, optional: true, doc: "Default: the default address book of the first account with contacts on."}
    result: Person
    errors: [invalidParams, notFound, conflict]
  - name: create
    doc: Add a contact (a vCard 3.0) to an address book and write it to the server (ADR-0030).
    params:
      - {name: collectionId, type: int, optional: true, doc: "Default: the default address book of the first account with contacts on."}
      - {name: fields, type: ContactFields, doc: "At least a name, an organization or an email address."}
    result: ContactWrite
    errors: [invalidParams, notFound, conflict]
  - name: update
    doc: Change a contact; the vCard keeps everything the fields do not touch (ADR-0030).
    params:
      - {name: id, type: int, doc: "The contact's ID."}
      - {name: fields, type: ContactFields}
    result: ContactWrite
    errors: [invalidParams, notFound, conflict]
  - name: delete
    doc: Delete a contact from its address book and the server.
    params:
      - {name: id, type: int}
    result: ContactWrite
    errors: [notFound, conflict]
  - name: setPhoto
    doc: Set or remove a contact's photo; the app scales it to at most 512 by 512 first.
    params:
      - {name: id, type: int}
      - {name: photo, type: Photo, optional: true, doc: "JPEG or PNG, at most 256 KB; absent removes the photo."}
    result: ContactWrite
    errors: [invalidParams, notFound, conflict]
  - name: restore
    doc: Undo a create, update, delete or setPhoto by writing back what it replaced (ADR-0032).
    params:
      - {name: restoreId, type: string}
    errors: [notFound, conflict]
events:
  - name: changed
    doc: An account's contacts changed, so people may have.
    durable: true
    fields:
      - {name: accountId, type: int}
  - name: refused
    doc: >-
      The server refused a change and it could not be applied again; the
      server's version stands (ADR-0030).
    fields:
      - {name: accountId, type: int}
      - {name: contactId, type: int, optional: true, doc: "Absent when the contact is gone."}
      - {name: name, type: string}
      - {name: reason, type: string, doc: "changed (another client changed the same fields), deleted, or refused."}
