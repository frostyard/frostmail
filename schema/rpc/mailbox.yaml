domain: mailbox
doc: Mailboxes (IMAP folders, and Gmail labels shown as folders).
enums:
  - name: MailboxRole
    doc: What a mailbox is for, from SPECIAL-USE attributes or name heuristics.
    values:
      - {name: none, doc: "An ordinary user folder."}
      - {name: inbox}
      - {name: drafts}
      - {name: sent}
      - {name: archive}
      - {name: junk}
      - {name: trash}
      - {name: all, doc: "All messages (Gmail All Mail)."}
      - {name: flagged, doc: "A server-side flagged view (Gmail Starred)."}
types:
  - name: Mailbox
    doc: One mailbox of one account.
    fields:
      - {name: id, type: int}
      - {name: accountId, type: int}
      - {name: path, type: string, doc: "Full server path, decoded from modified UTF-7."}
      - {name: name, type: string, doc: "The last path component, for display."}
      - {name: delimiter, type: string, doc: "The server's hierarchy delimiter; empty when flat."}
      - {name: role, type: MailboxRole}
      - {name: total, type: int, doc: "Messages stored locally for this mailbox."}
      - {name: unread, type: int, doc: "Unread messages stored locally for this mailbox."}
      - {name: label, type: bool, doc: "A Gmail label: a message can be in several labels at once, moving it out of one removes only that label, and All Mail is where Archive moves to."}
methods:
  - name: list
    doc: Mailboxes ordered by account, role, then path.
    params:
      - {name: accountId, type: int, optional: true, doc: "Limit to one account. Omit for all accounts."}
    result: "[]Mailbox"
  - name: create
    doc: >-
      Make a mailbox (a label on Gmail), at the top level or inside parentId,
      at once here and on the server when online. Conflict when the name is
      taken or the account is read-only.
    params:
      - {name: accountId, type: int}
      - {name: name, type: string, doc: "1-100 characters, without the account's hierarchy delimiter."}
      - {name: parentId, type: int, optional: true, doc: "A mailbox of the same account."}
    result: Mailbox
    errors: [invalidParams, notFound, conflict]
  - name: rename
    doc: >-
      Give a mailbox a new name in the same place; the mailboxes inside it
      follow. Conflict for a mailbox with a role, while the account has
      changes waiting to reach the server, or when the name is taken.
    params:
      - {name: id, type: int}
      - {name: name, type: string}
    result: Mailbox
    errors: [invalidParams, notFound, conflict]
  - name: move
    doc: >-
      Put a mailbox inside parentId, or at the top level without it; the
      mailboxes inside it follow. Conflict as rename, and for a parent inside
      the mailbox itself.
    params:
      - {name: id, type: int}
      - {name: parentId, type: int, optional: true}
    result: Mailbox
    errors: [invalidParams, notFound, conflict]
  - name: delete
    doc: >-
      Delete a mailbox, the mailboxes inside it, and their messages (on Gmail,
      the labels; the messages stay in All Mail). Conflict as rename.
    params:
      - {name: id, type: int}
    errors: [notFound, conflict]
  - name: setRole
    doc: >-
      Use This Mailbox For: make a mailbox the account's drafts, sent, junk,
      trash or archive mailbox, in place of the one the server names.
      Conflict on Gmail, whose mailboxes keep their roles.
    params:
      - {name: id, type: int}
      - {name: role, type: MailboxRole, doc: "drafts, sent, junk, trash or archive."}
    result: Mailbox
    errors: [invalidParams, notFound, conflict]
  - name: erase
    doc: >-
      Erase Deleted Items or Erase Junk Mail: delete every message in a trash
      or junk mailbox for good. Returns how many.
    params:
      - {name: id, type: int}
    result: int
    errors: [invalidParams, notFound, conflict]
events:
  - name: changed
    doc: A mailbox was created, renamed, deleted, or its counts changed.
    durable: true
    fields:
      - {name: id, type: int}
      - {name: accountId, type: int}
      - {name: deleted, type: bool}
