domain: rpc
protocol: 1
callers: [local, session, agent]
doc: >-
  Connection setup. A client calls rpc.hello first on every connection; the
  server answers any other method with notReady until hello succeeds.
enums:
  - name: CallerKind
    doc: Who a connection serves (docs/specs/lodge-app.md). A method a connection's caller may not use answers methodNotFound.
    values:
      - {name: local, doc: "maild's private socket: mailctl, and the app on the same machine."}
      - {name: session, doc: "A browser session through lodge's /app/mail/api."}
      - {name: agent, doc: "An MCP session through lodge's /mcp/mail."}
types:
  - name: Hello
    doc: Server identity, the negotiated protocol, and who the connection serves.
    fields:
      - {name: protocol, type: int, doc: "Protocol major version the server speaks."}
      - {name: server, type: string, doc: "Server name and version, for logs."}
      - {name: caller, type: CallerKind, optional: true, doc: "The connection's caller; absent from a maild older than callers, which serves local only."}
      - {name: login, type: string, optional: true, doc: "A session's tailnet login, from lodge."}
      - {name: nodeName, type: string, optional: true, doc: "A session's tailnet node name, from lodge."}
      - {name: displayName, type: string, optional: true, doc: "A session's display name, when lodge has one."}
      - {name: build, type: string, optional: true, doc: "The Flatpak build this maild runs from: the app-commit of its instance, which differs for every build, even of one version. Absent outside the Flatpak (ADR-0046)."}
methods:
  - name: hello
    doc: Negotiate the protocol major version. Changes within a major version are additive only.
    params:
      - {name: protocol, type: int, doc: "Protocol major version the client speaks."}
      - {name: client, type: string, doc: "Client name and version, for logs."}
    result: Hello
    errors: [protocolMismatch]
  - name: ping
    doc: Do nothing; a web client calls it at least every 30 s while visible, so lodge keeps its session.
  - name: shutdown
    callers: [local]
    doc: >-
      Stop maild as SIGTERM does: it answers, finishes the work in hand, releases the data directory's lock and exits 0.
      The Flatpak's app and launcher call it to leave local mode and to replace
      an older build (ADR-0046).
