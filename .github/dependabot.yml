# Dependabot (frostyard/core ADR-0071, baseline row B13): 1 entry for each
# ecosystem with a manifest here. internal/workflowcheck checks the list.
#
# A gomod, npm or app/src-tauri cargo update also changes the Flatpak's
# offline sources: its PR fails the Flatpak workflow's sources check until
# `make flatpak-sources` (nsl) is run on its branch: the owner runs it in
# the nsl machine during triage and pushes the result to the Dependabot
# branch. third_party/go-imap is a patched fork (ADR-0004): it is updated by
# hand, never by Dependabot.
#
# Each group takes only minor and patch updates. A major update comes as a
# PR of its own, because it can break the build and needs its own decision.
#
# frostyard-problems (app/src-tauri) is a cargo git dependency on a tag of
# frostyard/std. Dependabot cannot resolve it: its update job tried std's tag
# v0.3.0, which holds no crate, and failed. Internal bumps go by hand
# (AGENTS.md, Releases and dependencies); internal/workflowcheck requires an
# ignore entry for each frostyard git crate.
#
# The commit prefix is build (or ci): svu reads it as a patch, not a feature.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      app-npm:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: frostyard-problems
    groups:
      app-cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /app/notify
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      notify-cargo:
        patterns: ["*"]
        update-types: [minor, patch]
