# Release (frostyard/core ADR-0011, ADR-0012, ADR-0053): a v* tag, made by
# make bump, builds frostyard-maild_X.Y.Z_amd64.deb, attests it and attaches
# it to the GitHub release. The build job runs third-party npm code, so it has
# no write token and no id-token; the release job runs none of it.
#
# A pre-release tag vX.Y.Z-rc.N publishes only the Flatpak candidate
# (.github/workflows/flatpak.yml, plan 0013, Phase 8): it builds no .deb and
# makes no GitHub release. Without the !v*-* exclusion the tag check below
# fails the run.
name: Release

on:
  push:
    tags: ["v*", "!v*-*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.21.0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  build:
    name: Build the .deb (make deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: The tag is a release version
        run: |
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by app/package.json.
      - run: corepack enable
      - name: Web build
        run: make web-build IN_NSL='sh -c'
      - name: The .deb (deb-check runs inside)
        run: make deb DEB_VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7

  release:
    name: Attest and release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
