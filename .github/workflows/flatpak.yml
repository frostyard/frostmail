# Builds the Flatpak, with its tests, on every pull request and push to main
# (docs/adr/0045-the-desktop-app-builds-as-a-flatpak-in-ci.md), as igloo's
# workflow does. The sources job checks that the offline sources (crates, pnpm
# store and Go modules) match the lockfiles and go.mod and go.sum. A
# vX.Y.Z-rc.N tag publishes an OCI image to ghcr.io/frostyard/frostmail with
# its version and sha- tags, and attests its digest: a release candidate is
# not the release (plan 0013, Phase 8). A vX.Y.Z release tag publishes nothing
# here: the Promote workflow (.github/workflows/promote.yml) moves the version
# and latest tags to the digest of the candidate the gate passed (plan 0013,
# Phase 10), so the release serves exactly the image that was attested and
# tested. Any other v* tag fails in the publish job and publishes nothing. The
# Frostyard remote (https://github.com/frostyard/flatpak-index) serves a digest
# only when this workflow, on a v* tag, attested it, so main pushes publish
# nothing.
#
# Every action is pinned to a commit SHA (core ADR-0021); Dependabot bumps the
# SHA and the version comment together.
name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the older run of a pull request, never a tag run.
concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ID: org.frostyard.Frostmail
  IMAGE: ghcr.io/frostyard/frostmail

jobs:
  sources:
    name: Flatpak sources (make flatpak-sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Regenerate the offline sources
        run: make flatpak-sources
      - name: The committed sources match the lockfiles and go.mod
        run: git diff --exit-code -- packaging/flatpak

  flatpak:
    name: Flatpak (build and test)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # flatpak-builder sandboxes builds with bubblewrap, which needs a
    # privileged container. The image is pinned by digest.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: packaging/flatpak/org.frostyard.Frostmail.json
          bundle: frostmail.flatpak
          artifact-name: frostmail-flatpak
          run-tests: true
          # The runtime and the SDK extensions come from the cache; the app
          # always rebuilds, and a change of the manifest or of a sources
          # file starts the cache afresh.
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/org.frostyard.Frostmail.json', 'packaging/flatpak/cargo-sources.json', 'packaging/flatpak/node-sources.json', 'packaging/flatpak/go-sources.json') }}

      - name: Export the OCI image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: flatpak build-bundle --oci --arch=x86_64 repo frostmail.oci "$APP_ID"

      - name: Keep the OCI image for publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frostmail-oci
          path: frostmail.oci
          retention-days: 1

  publish:
    name: Publish
    needs: [sources, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # GitHub-hosted on purpose: flatpak-index rejects attestations from
    # self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # A release candidate vX.Y.Z-rc.N (plan 0013, Phase 8) publishes and
      # attests its version and sha- tags. A release tag vX.Y.Z publishes
      # nothing: the Promote workflow (.github/workflows/promote.yml) moves the
      # version and latest tags to the digest the gate passed (plan 0013,
      # Phase 10). Any other v* tag fails here and publishes nothing.
      - name: Name the OCI tags
        id: tags
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the release $TAG publishes no image: the Promote workflow moves the version tag and latest to the digest of an attested candidate"
          elif [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag $TAG is neither vX.Y.Z nor vX.Y.Z-rc.N" >&2
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.tags.outputs.publish == 'true'
        with:
          name: frostmail-oci
          path: frostmail.oci

      - name: Log in to GHCR
        if: steps.tags.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin

      # The version and commit tags of the candidate, in one push of the image
      # the build made. The release tags come later, from the promotion, so
      # the remote never serves a digest this workflow did not attest.
      - name: Push the version to GHCR
        id: push
        if: steps.tags.outputs.publish == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          skopeo copy --digestfile digest oci:frostmail.oci "docker://$IMAGE:$VERSION"
          digest="$(cat digest)"
          skopeo copy --preserve-digests "docker://$IMAGE@$digest" "docker://$IMAGE:sha-${GITHUB_SHA::12}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the image
        if: steps.tags.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
