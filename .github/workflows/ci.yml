# CI (docs/design/testing.md): the jobs of `make ci`, which runs the same
# gates on a developer's machine. Actions are pinned to full commit SHAs
# and jobs get only the permissions they need (frostyard/core ADR-0021,
# checked by internal/workflowcheck); tools come from go.mod, mise.lock and
# the app's manifests (ADR-0043). The web app's targets normally run in the
# nsl machine; here IN_NSL runs them on the runner. The Windows jobs run the
# Go suite on Windows, which `make verify` only vets, and build the Windows
# app and its installer (ADR-0038, ADR-0054). The App shell and Windows app
# jobs keep their names: the branch's required checks match on them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "37 5 * * *" # nightly, so upstream drift surfaces within a day
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The app toolchain; dev/nsl/provision.sh pins the same versions.
  NODE_VERSION: "24.21.0"
  RUST_TOOLCHAIN: "1.99.0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    name: Verify (make verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FROSTMAIL_REQUIRE_DBUS: "1" # the notification tests must not skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The locked golangci-lint, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: golangci-lint
          cache: true
      # The desktop app's view tests render headless with MyGo, which lays
      # text out with Pango and cairo (no GTK, no display).
      - name: Install Pango and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core libpangocairo-1.0-0
      - name: Tidy, generated files, vet, format, lint, unit and fork tests
        run: make verify

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FROSTMAIL_REQUIRE_DBUS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The desktop app's view tests render headless with MyGo, which lays
      # text out with Pango and cairo (no GTK, no display).
      - name: Install Pango and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-dejavu-core libpangocairo-1.0-0
      - run: go test -race ./...

  windows:
    name: Windows (go test)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Fixtures and golden files are byte-exact: no CRLF on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  vulncheck:
    name: Vulnerabilities (make vulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The version is pinned in the Makefile; the Go checksum database verifies the module.
      - name: govulncheck
        run: make vulncheck

  ui:
    name: App UI (make ui-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by app/package.json.
      - run: corepack enable
      - name: Biome, typecheck and Vitest
        run: make ui-check IN_NSL='sh -c'

  deb:
    name: Snapshot .deb (make deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Web build
        run: make web-build IN_NSL='sh -c'
      - name: The snapshot .deb (deb-check runs inside)
        run: make deb

  app:
    name: App shell (make app-build, app-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Release builds of the app
        run: make desktop-build desktop-build-windows
      # What ui.Tester cannot show: a real page, a real pointer and more than
      # one window, on GTK and WebKitGTK. The runner has no GPU.
      - name: The app's real-window checks on WebKitGTK
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libgtk-3-0t64 libwebkit2gtk-4.1-0 libpangocairo-1.0-0 fonts-dejavu-core xvfb xauth xdotool dbus
          env -u WAYLAND_DISPLAY GDK_BACKEND=x11 WEBKIT_DISABLE_COMPOSITING_MODE=1 dbus-run-session -- \
            xvfb-run -a -s "-screen 0 1400x900x24" make desktop-e2e

  windows-app:
    name: Windows app (installer, WebView2 e2e)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo-target
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('app/notify/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: The notifier
        run: |
          set -euo pipefail
          cd app/notify
          cargo test --release --locked
          cargo build --release --locked
      - name: The installer
        run: scripts/windows-installer.sh "$CARGO_TARGET_DIR/release/frostmail-notify.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frostmail-windows-installer
          path: build/mygo/windows-amd64/*-setup-*.exe
          if-no-files-found: error
          retention-days: 14
      # A silent install, what it leaves, and a silent uninstall.
      - name: Install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-Item build/mygo/windows-amd64/*-setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'frostmail-install'
          $mail = Join-Path $env:LOCALAPPDATA 'Frostmail'
          # The uninstaller removes the install folder whole, so the folder
          # with the mail is refused.
          $refused = Start-Process -PassThru -FilePath $setup -ArgumentList '/S', "/D=$mail"
          [void]$refused.Handle
          $refused.WaitForExit()
          if ($refused.ExitCode -eq 0) { throw 'the installer took the folder with the mail' }
          if (Test-Path (Join-Path $mail 'Frostmail.exe')) { throw 'the refused install left files' }
          # Not Start-Process -Wait, which also waits for the maild it leaves running.
          (Start-Process -PassThru -FilePath $setup -ArgumentList '/S', "/D=$dir").WaitForExit()
          foreach ($f in 'Frostmail.exe', 'maild.exe', 'mailctl.exe', 'frostmail-notify.exe', 'frostmail.png', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "the install has no $f" }
          }
          foreach ($k in 'HKCU:\Software\Classes\AppUserModelId\org.frostyard.Frostmail', 'HKCU:\Software\Classes\frostmail-toast') {
            if (-not (Test-Path $k)) { throw "the install has no $k" }
          }
          # A silent uninstall keeps the mail.
          $probe = Join-Path $mail 'Data\probe'
          New-Item -Force -ItemType File $probe | Out-Null
          (Start-Process -PassThru -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S', "_?=$dir").WaitForExit()
          if (-not (Test-Path $probe)) { throw 'the silent uninstall deleted the mail' }
          foreach ($k in 'HKCU:\Software\Classes\AppUserModelId\org.frostyard.Frostmail', 'HKCU:\Software\Classes\frostmail-toast') {
            if (Test-Path $k) { throw "the uninstall left $k" }
          }
      # The reader on WebView2 (ADR-0038) and the app's windows, driven with
      # the automation build. WebView2 needs a window, so an interactive
      # desktop session.
      - name: The app's real-window checks on WebView2
        run: |
          set -euo pipefail
          powershell -NoProfile -Command '"session " + (Get-Process -Id $PID).SessionId + ", interactive " + [Environment]::UserInteractive'
          go test -tags e2e -timeout 15m -count=1 ./internal/desktop/e2e/
