# CI (docs/design/testing.md): the jobs of `make ci`, which runs the same
# gates on a developer's machine. Actions are pinned to full commit SHAs
# and jobs get only the permissions they need (frostyard/core ADR-0021,
# checked by internal/workflowcheck); tools come from go.mod, mise.lock and
# the app's manifests (ADR-0043). The web app's targets normally run in the
# nsl machine; here IN_NSL runs them on the runner. The Windows jobs run the
# Go suite on Windows, which `make verify` only vets, and build the Windows
# installer of the NSGo client and check an install of it (ADR-0038,
# ADR-0063). Job display names also name required checks; coordinate
# renames with the main branch rulesets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "37 5 * * *" # nightly, so upstream drift surfaces within a day
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The app toolchain; dev/nsl/provision.sh pins the same versions.
  NODE_VERSION: "24.21.0"
  RUST_TOOLCHAIN: "1.99.0"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  verify:
    name: Verify (make verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FROSTMAIL_REQUIRE_DBUS: "1" # the notification tests must not skip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The locked golangci-lint, checksum-verified, as `mise install` does.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: golangci-lint
          cache: true
      - name: Tidy, generated files, vet, format, lint, unit and fork tests
        run: make verify

  # The race gate (make race), split over runners: tools/testshard deals the
  # packages of `go list ./...` into the shards, which together hold every
  # package once. The job below, Race detector, is the required check.
  race-shard:
    name: Race detector, shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      FROSTMAIL_REQUIRE_DBUS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The race build of the standard library and the dependencies, in a
      # build cache of its own. setup-go's cache has none of it: every Linux
      # job shares its key, and the first job to finish saves it, which is
      # govulncheck's. Only main saves this one, when go.mod or go.sum
      # changed; pull requests restore main's.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: race-cache
        with:
          path: ${{ runner.temp }}/go-build-race
          key: go-build-race-${{ runner.os }}-shard-${{ matrix.shard }}-of-4-${{ hashFiles('go.mod', 'go.sum') }}
      # -count=1: every test runs; no result comes from a cache.
      #
      # trim.txt holds the time go last trimmed its build cache. go trims
      # entries unused for 5 days at the end of a build, at most once a day,
      # and the first build here is tools/testshard's: without today's time
      # in trim.txt, it would empty a restored cache that main saved more
      # than 5 days ago, before the tests use it.
      - name: go test -race, this shard's packages
        env:
          RACE_SHARD: ${{ matrix.shard }}/4
          GOCACHE: ${{ runner.temp }}/go-build-race
        run: |
          mkdir -p "$GOCACHE"
          date +%s > "$GOCACHE/trim.txt"
          make race RACE_FLAGS=-count=1
      # A failed save must not fail the shard.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.race-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/go-build-race
          key: ${{ steps.race-cache.outputs.cache-primary-key }}

  # The required check. It runs whatever the shards did, and passes only
  # when every shard passed: without always(), a failed shard would leave
  # this job skipped, and a skipped required check counts as passed.
  race:
    name: Race detector
    needs: race-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.race-shard.result }}
        run: |
          echo "The race shards: $SHARDS"
          test "$SHARDS" = success

  windows:
    name: Windows (go test)
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Fixtures and golden files are byte-exact: no CRLF on checkout.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test ./...

  vulncheck:
    name: Vulnerabilities (make vulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The version is pinned in the Makefile; the Go checksum database verifies the module.
      - name: govulncheck
        run: make vulncheck

  # The desktop app, the NSGo client: its workflows on fixture mail, headless
  # and in a real GTK 4 window, its Windows build, and its Lodge build. The
  # name is the required check that the MyGo client's job had.
  nsgo:
    name: Desktop app (Linux e2e, cross-builds)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cmd/frostmail-nsgo/go.mod
          cache-dependency-path: |
            go.sum
            cmd/frostmail-nsgo/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - run: make nsgo-test nsgo-build
      # The same workflows in a real GTK 4 window, under Xvfb (plan 0016,
      # rule 10). NSGo loads GTK 4, WebKitGTK 6 and XTest at run time.
      - name: Install the window runtime of the live suite
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libgtk-4-1 libwebkitgtk-6.0-4 libxtst6 libxi6 fonts-dejavu-core xvfb xauth
      - run: make nsgo-live
      # The pictures this run drew, to read beside the kept ones
      # (cmd/frostmail-nsgo/comparison/linux). No step compares them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: nsgo-live-pictures
          path: cmd/frostmail-nsgo/.nsgo/test/screenshots/linux
          if-no-files-found: warn
      - name: Cross-build the Windows client
        run: make nsgo-build-windows
      - name: Build the Lodge app with the shared client
        run: make nsgo-lodge-app IN_NSL='sh -c'

  ui:
    name: App UI (make ui-check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from corepack, pinned with its hash by app/package.json.
      - run: corepack enable
      - name: Biome, typecheck and Vitest
        run: make ui-check IN_NSL='sh -c'

  deb:
    name: Snapshot .deb (make deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install: true
          install_args: nfpm
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: corepack enable
      - name: Web build
        run: make web-build IN_NSL='sh -c'
      - name: The snapshot .deb (deb-check runs inside)
        run: make deb

  # The notifier, the installer, and an install of it whose client opens a
  # native window. The name is a required check's.
  windows-app:
    name: Windows app (installer, native e2e)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/build/cargo-target
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/cargo-target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('app/notify/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-
      - name: The notifier
        run: |
          set -euo pipefail
          cd app/notify
          cargo test --release --locked
          cargo build --release --locked
      # The installer, whose program is the NSGo client (plan 0017, Phase
      # 3), and the same installer under a check's names, which installs
      # beside a real install: the checks of an install on a Windows desktop
      # take it there.
      - name: The installer
        run: scripts/windows-installer.sh "$CARGO_TARGET_DIR/release/frostmail-notify.exe"
      - name: The installer, under a check's names
        env:
          FROSTMAIL_INSTALLER_CHECK: "1"
        run: scripts/windows-installer.sh "$CARGO_TARGET_DIR/release/frostmail-notify.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frostmail-windows-installer
          path: build/windows-installer/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frostmail-windows-installer-check
          path: build/windows-installer-check/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      # A silent install, what it leaves, the installed app's window, and a
      # silent uninstall.
      - name: Install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-Item build/windows-installer/*-setup.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'frostmail-install'
          $mail = Join-Path $env:LOCALAPPDATA 'Frostmail'
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\org.frostyard.Frostmail'
          $keys = 'HKCU:\Software\Classes\AppUserModelId\org.frostyard.Frostmail', 'HKCU:\Software\Classes\frostmail-toast'
          # The uninstaller can delete the folder with the mail, so the
          # installer refuses it.
          $refused = Start-Process -PassThru -FilePath $setup -ArgumentList '/S', "/D=$mail"
          [void]$refused.Handle
          $refused.WaitForExit()
          if ($refused.ExitCode -eq 0) { throw 'the installer took the folder with the mail' }
          if (Test-Path (Join-Path $mail 'FrostMail.exe')) { throw 'the refused install left files' }
          # Not Start-Process -Wait, which also waits for the maild it leaves running.
          $install = Start-Process -PassThru -FilePath $setup -ArgumentList '/S', "/D=$dir"
          [void]$install.Handle
          $install.WaitForExit()
          if ($install.ExitCode -ne 0) { throw "the installer exited with $($install.ExitCode)" }
          foreach ($f in 'FrostMail.exe', 'maild.exe', 'mailctl.exe', 'frostmail-notify.exe', 'frostmail.png', 'Uninstall.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "the install has no $f" }
          }
          foreach ($k in @($entry) + $keys) {
            if (-not (Test-Path $k)) { throw "the install has no $k" }
          }
          # The installed client opens a window, on the maild the install started.
          $client = Start-Process -PassThru -FilePath (Join-Path $dir 'FrostMail.exe')
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 250
              $client.Refresh()
              if ($client.HasExited) { throw "FrostMail.exe exited with $($client.ExitCode)" }
            } while ($client.MainWindowHandle -eq 0 -and [DateTime]::UtcNow -lt $deadline)
            if ($client.MainWindowHandle -eq 0) { throw 'FrostMail.exe did not open a window' }
          } finally {
            if (-not $client.HasExited) { $client.Kill(); $client.WaitForExit() }
          }
          # A silent uninstall keeps the mail. It runs as a user's does, from
          # the copy NSIS makes of the uninstaller outside the install folder,
          # since the uninstaller stops whatever runs from that folder: so
          # wait for what it removes, not for the process.
          $probe = Join-Path $mail 'Data\probe'
          New-Item -Force -ItemType File $probe | Out-Null
          (Start-Process -PassThru -FilePath (Join-Path $dir 'Uninstall.exe') -ArgumentList '/S').WaitForExit()
          $deadline = [DateTime]::UtcNow.AddSeconds(60)
          while ((Test-Path (Join-Path $dir 'Uninstall.exe')) -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 250
          }
          foreach ($f in 'FrostMail.exe', 'maild.exe', 'mailctl.exe', 'frostmail-notify.exe', 'frostmail.png', 'Uninstall.exe') {
            if (Test-Path (Join-Path $dir $f)) { throw "the uninstall left $f" }
          }
          if (-not (Test-Path $probe)) { throw 'the silent uninstall deleted the mail' }
          foreach ($k in @($entry) + $keys) {
            if (Test-Path $k) { throw "the uninstall left $k" }
          }
