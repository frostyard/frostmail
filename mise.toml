# Tool pins for this repository (frostyard/core ADR-0043). Go comes from go.mod;
# never pin it here. mise.lock carries each tool's checksums: `mise install`
# provisions exactly these. The app toolchain (Node, pnpm, Rust) lives in the
# nsl machine instead (dev/nsl/provision.sh).
[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[tools]
# make lint, and so make verify, check and ci; the Makefile checks this release.
golangci-lint = "2.13.1"
