<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <title>Frostmail</title>
  <desc>A snowflake-marked letter in a faceted ice-blue envelope on a chamfered midnight-blue tile.</desc>
  <!-- Frostyard core .agents/skills/frostyard-design/tokens/colors.css:
       ink #06111d, deep #081b2d, panel #0d263b, ice #aee9ff,
       sky #47b8ef, blue #168bd0, text-body #edf8ff, line-strong #2c6380.
       Gradient stops below also come from gradient-panel / gradient-primary. -->
  <defs>
    <linearGradient id="tile" x1="32" y1="32" x2="480" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d2d45"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>
    <linearGradient id="paper" x1="152" y1="96" x2="356" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#aee9ff"/>
    </linearGradient>
    <linearGradient id="front" x1="104" y1="264" x2="392" y2="408" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ac9f7"/>
      <stop offset="1" stop-color="#1584ca"/>
    </linearGradient>
    <path id="flake-arm" d="M256 150V206 M241 163L256 178L271 163"/>
  </defs>
  <!-- A cut-corner frame: almost square, with transparent outer padding. -->
  <path d="M64 16H448L496 64V448L448 496H64L16 448V64Z" fill="#06111d"/>
  <path d="M66 20H446L492 66V446L446 492H66L20 446V66Z" fill="url(#tile)" stroke="#2c6380" stroke-width="2"/>
  <!-- The open flap and its dark interior frame the pale letter. -->
  <path d="M88 224L244 112Q256 104 268 112L424 224V384L400 408H112L88 384Z" fill="#081b2d" stroke="#47b8ef" stroke-width="4" stroke-linejoin="round"/>
  <path d="M88 224L256 332L424 224L256 128Z" fill="#0d263b"/>
  <!-- Ice-cut stationery; the folded upper corner is a separate facet. -->
  <path d="M144 304V108L160 92H312L368 148V304L256 360Z" fill="url(#paper)"/>
  <path d="M312 92V148H368Z" fill="#47b8ef"/>
  <path d="M312 148H368L312 172Z" fill="#168bd0" opacity=".24"/>
  <!-- Sixfold snow crystal, drawn as paths so no font is required. -->
  <g stroke="#0d263b" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#flake-arm"/>
    <use href="#flake-arm" transform="rotate(60 256 206)"/>
    <use href="#flake-arm" transform="rotate(120 256 206)"/>
    <use href="#flake-arm" transform="rotate(180 256 206)"/>
    <use href="#flake-arm" transform="rotate(240 256 206)"/>
    <use href="#flake-arm" transform="rotate(300 256 206)"/>
  </g>
  <!-- Envelope folds meet in a deep V; large facets survive downsampling. -->
  <path d="M88 224L256 332L112 408L88 384Z" fill="#aee9ff"/>
  <path d="M424 224L256 332L400 408L424 384Z" fill="#47b8ef"/>
  <path d="M112 408L230 310L256 328L282 310L400 408Z" fill="url(#front)"/>
  <path d="M88 224L256 332L424 224" stroke="#081b2d" stroke-width="8" stroke-linejoin="miter"/>
  <path d="M112 408L230 310M282 310L400 408" stroke="#edf8ff" stroke-opacity=".45" stroke-width="2"/>
  <!-- Frostyard's diamond-crystal motif doubles as the envelope clasp. -->
  <path d="M256 318L272 334L256 350L240 334Z" fill="#081b2d"/>
  <path d="M256 327L263 334L256 341L249 334Z" fill="#aee9ff"/>
</svg>
