# maild's system user for lodge (docs/specs/lodge-app.md): in lodge-apps,
# for lodge's inference socket, and never in lodge.
u frostmail - "Frostmail mail engine" /var/lib/frostmail
# Group lodge owns the app socket (SocketGroup=lodge). This file declares the
# group too, so that the socket starts without lodge's own sysext (core
# ADR-0058). The user is never a member of group lodge.
g lodge -
g lodge-apps -
m frostmail lodge-apps
